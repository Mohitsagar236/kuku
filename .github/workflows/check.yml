name: Verify application
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-dev.lock
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: python -m venv .venv
      - run: .venv/bin/pip install -r requirements-dev.lock
      - run: .venv/bin/pip install --no-deps -e .
      - run: make frontend-install frontend-build
      - run: make check
      - run: cd frontend && npx playwright install --with-deps chromium
      - run: make browser-test
      - run: .venv/bin/python -m build
      - name: Verify installed wheel outside checkout
        run: |
          python -m venv /tmp/promo-wheel
          /tmp/promo-wheel/bin/pip install -c requirements.lock dist/*.whl
          cd /tmp
          /tmp/promo-wheel/bin/promo-finder --help
          /tmp/promo-wheel/bin/python -c "from promo_finder.infrastructure.config import find_config_dir; from promo_finder.infrastructure.llm.prompts import load_prompt; from promo_finder.interfaces.web.app import WEB_ROOT; assert find_config_dir().is_dir(); assert load_prompt('score_v1').system; assert (WEB_ROOT / 'index.html').is_file()"
