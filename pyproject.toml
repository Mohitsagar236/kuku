[project]
name = "promo-finder"
version = "0.1.0"
description = "Finds 20-60s promo clips in microdrama screenplays"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6",
    "httpx>=0.27",
    "pathspec>=0.12",
    "pypdf>=5.4",
]

[project.scripts]
promo-finder = "promo_finder_cli.__main__:main"

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "ruff", "mypy", "hypothesis", "types-pyyaml"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["libs/common", "services/ingestion", "services/candidate", "services/scoring", "services/ranking", "services/evaluation", "cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["libs/common", "services/ingestion", "services/candidate", "services/scoring", "services/ranking", "services/evaluation", "cli"]
addopts = "-q"

[tool.coverage.run]
source = ["promo_common", "ingestion_service", "candidate_service", "scoring_service", "ranking_service", "evaluation_service", "promo_finder_cli"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E501"]
"**/report.py" = ["E501"]   # markdown text generation
"cli/**" = ["E501"]   # CLI/report text output

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
mypy_path = "libs/common:services/ingestion:services/candidate:services/scoring:services/ranking:services/evaluation:cli"

[[tool.mypy.overrides]]
module = "promo_common.*"
strict = true
