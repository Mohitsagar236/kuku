# Render Blueprint: password-protected Promo Finder viewer.
# Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: promo-finder
    runtime: docker
    plan: starter              # persistent disks need a paid plan
    healthCheckPath: /readyz
    envVars:
      - key: PF_VIEWER_PASSWORD
        sync: false            # you type it in the Render dashboard; never commit it
      - key: PF_ALLOWED_HOSTS
        value: promo-finder.onrender.com   # change to your service's real hostname
      - key: PF_LOG_LEVEL
        value: INFO
    disk:
      name: promo-outputs
      mountPath: /app/outputs  # runs and saved reviews live here
      sizeGB: 1
