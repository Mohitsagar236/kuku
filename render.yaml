# Free public demo: fictional sample show scored once with a real model (shipped data), plus
# in-app upload: visitors analyse their own screenplay (rules-only, or with their own API key).
# Uploads are private/unlisted and deleted after an hour. No server-side model key, no confidential
# outputs, no passwords, no persistent disks. PF_ANALYZE=false turns uploads off.
services:
  - type: web
    name: promo-finder-demo
    runtime: docker
    plan: free
    healthCheckPath: /readyz
    envVars:
      - key: PF_DEMO_MODE
        value: "true"
      - key: PF_ALLOWED_HOSTS
        fromService:
          name: promo-finder-demo
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: PF_LOG_LEVEL
        value: INFO
