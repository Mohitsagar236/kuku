# Free public demo: fictional sample inputs, mock scores, ephemeral shared reviews.
# No confidential outputs, model keys, passwords or persistent paid disks.
services:
  - type: web
    name: promo-finder-demo
    runtime: docker
    plan: free
    healthCheckPath: /readyz
    envVars:
      - key: PF_DEMO_MODE
        value: "true"
      - key: PF_ALLOWED_HOSTS
        fromService:
          name: promo-finder-demo
          type: web
          envVarKey: RENDER_EXTERNAL_HOSTNAME
      - key: PF_LOG_LEVEL
        value: INFO
