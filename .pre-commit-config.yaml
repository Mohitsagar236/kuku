# Hooks use the project's own tools (.venv), so versions match local runs and no network is needed.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: .venv/bin/ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: .venv/bin/ruff format
        language: system
        types: [python]
      - id: confidential-scan
        name: no script text in committable files
        # needs PF_REAL_SHOW_DIR=<path to the confidential input>; skips with a warning if unset
        entry: .venv/bin/python -m promo_finder.interfaces.cli check-confidential
        language: system
        pass_filenames: false
        always_run: true
